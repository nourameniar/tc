function home(){
app.innerHTML=`<div class="card center"><div style="font-size:70px">🏆</div><h1>Le grand challenge de culture économique</h1><p class="lead">5 défis • 50 points • Choisis librement ton parcours.</p><input id="nm" class="name" placeholder="Prénom NOM"><br><button class="gold" onclick="start()">COMMENCER</button><div class="tiles">${G.map((x,i)=>`<div class="tile"><div style="font-size:30px">${x[0]}</div><b>${i+1}. ${x[1]}</b><span class="small">/${x[2]} points</span></div>`).join("")}</div></div>`}
function start(){let n=document.getElementById("nm").value.trim();if(!n)return alert("Entre ton prénom et ton nom.");S.name=n;menu()}
function menu(){
let finished=S.done.filter(Boolean).length;
if(finished===5){finish();return}
app.innerHTML=`<div class="card center"><div class="tag">${S.name}</div><h1>Choisis ton prochain défi</h1><p class="lead">${finished}/5 défi${finished>1?"s":""} terminé${finished>1?"s":""} • Score actuel : <b>${S.total}/50</b></p><div class="tiles">${G.map((x,i)=>`<div class="tile" style="${S.done[i]?"opacity:.38;filter:grayscale(1)":""}"><div style="font-size:38px">${S.done[i]?"✓":x[0]}</div><b>${x[1]}</b><span class="small">${S.done[i]?"TERMINÉ — "+S.s[i]+"/"+x[2]:"/"+x[2]+" points"}</span><br>${S.done[i]?"":`<button class="gold" onclick="pick(${i})">JOUER</button>`}</div>`).join("")}</div></div>`}
function pick(i){if(S.done[i])return;S.g=i;intro()}
function intro(){let x=G[S.g];app.innerHTML=`<div class="card center"><div style="font-size:75px">${x[0]}</div><div class="tag">DÉFI</div><h1>${x[1]}</h1><h2>${x[2]} points</h2><button class="gold" onclick="begin()">JOUER</button><button class="blue" onclick="menu()">RETOUR</button></div>`}
function begin(){S.i=0;S.sel=null;S.h=0;render()}
function hd(n){return `<div class="meta"><span>${G[S.g][0]} ${G[S.g][1]}</span><span>${S.i+1}/${n}</span></div><div class="bar"><div style="width:${100*S.i/n}%"></div></div>`}
function add(p){S.total+=p;S.s[S.g]+=p;st.textContent=(Number.isInteger(S.total)?S.total:S.total.toFixed(2).replace(/0$/,""))+" / 50"}
function choose(k){S.sel=k;document.querySelectorAll(".a").forEach(x=>x.classList.remove("sel"));document.querySelector(`[data-k="${k}"]`).classList.add("sel")}
function fb(t){let f=document.getElementById("fb");f.innerHTML=t;f.style.display="block"}
function swap(){document.getElementById("val").style.display="none";document.getElementById("nx").style.display="inline-block"}
function next(n){S.sel=null;if(++S.i<n)render();else end()}
function qcm(x,n,tag,pts=1){app.innerHTML=`<div class="card">${hd(n)}<div class="tag">${tag}</div><div class="q">${x[0]}</div><div class="answers">${x[1].map((a,k)=>`<button class="a" data-k="${k}" onclick="choose(${k})"><b>${"ABCD"[k]}.</b> ${a}</button>`).join("")}</div><div id="fb" class="fb"></div><button id="val" class="gold" onclick="checkQ(${x[2]},${n},${pts})">VALIDER</button><button id="nx" class="gold" style="display:none" onclick="next(${n})">SUIVANT →</button></div>`}
function checkQ(ok,n,p){if(S.sel===null)return;document.querySelectorAll(".a").forEach(b=>{let k=+b.dataset.k;if(k===ok)b.classList.add("ok");if(k===S.sel&&k!==ok)b.classList.add("bad");b.disabled=true});let x=S.g===0?million[S.i]:eye[S.i];if(S.sel===ok)add(p);fb(x[3]||x[4]);swap()}
function render(){st.textContent=(Number.isInteger(S.total)?S.total:S.total.toFixed(2).replace(/0$/,""))+" / 50";if(S.g===0)qcm(million[S.i],million.length,"Culture économique",1);if(S.g===1)whoRender();if(S.g===2)vfRender();if(S.g===3)priceRender();if(S.g===4)eyeRender()}
function whoRender(){let x=who[S.i];S.h=0;app.innerHTML=`<div class="card">${hd(who.length)}<div class="tag">Indices progressifs</div><div id="cl" class="q">1. ${x[0][0]}</div><div class="center"><input id="wi" class="name" placeholder="Ta réponse"><br><button id="more" class="blue" onclick="more()">INDICE SUIVANT</button><button id="val" class="gold" onclick="checkWho()">VALIDER</button><button id="nx" class="gold" style="display:none" onclick="next(${who.length})">SUIVANT →</button></div><div id="fb" class="fb"></div></div>`}
function more(){S.h=Math.min(2,S.h+1);document.getElementById("cl").innerHTML=who[S.i][0].slice(0,S.h+1).map((x,i)=>`${i+1}. ${x}`).join("<br><br>");if(S.h===2)document.getElementById("more").disabled=true}
function norm(x){return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"")}
function checkWho(){let x=who[S.i],v=document.getElementById("wi").value.trim();if(!v)return;let good=norm(v).includes(norm(x[1]))||norm(x[1]).includes(norm(v));let pts=good?(S.h===0?1:S.h===1?0.75:0.5):0;if(pts)add(pts);fb(`<b>${good?"Trouvé ! +"+pts+" pt"+(pts>1?"s":""):"Réponse : "+x[1]}</b><br>${good?(S.h===0?"Trouvé dès le 1er indice.":S.h===1?"Un indice supplémentaire : -0,25 pt.":"Deux indices supplémentaires : -0,50 pt.")+"<br>":""}${x[2]}`);swap();document.getElementById("wi").disabled=true}
function vfRender(){let x=vf[S.i];app.innerHTML=`<div class="card">${hd(vf.length)}<div class="tag">Idée reçue ou réalité ?</div><div class="q">${x[0]}</div><div class="vf"><button class="blue" onclick="checkVF(true)">✓ VRAI</button><button class="blue" onclick="checkVF(false)">✕ FAUX</button></div><div id="fb" class="fb"></div><button id="nx" class="gold" style="display:none" onclick="next(${vf.length})">SUIVANT →</button></div>`}
function checkVF(v){let x=vf[S.i];document.querySelectorAll(".vf button").forEach(b=>b.disabled=true);if(v===x[1])add(1);fb(`<b>${v===x[1]?"Bonne réponse !":"Raté !"}</b><br>${x[2]}`);document.getElementById("nx").style.display="inline-block"}
function priceRender(){let x=price[S.i];app.innerHTML=`<div class="card">${hd(price.length)}<div class="tag">Estime au plus juste</div><div class="q">${x[0]}</div><div class="center"><input id="pi" class="num" type="number" step="0.01" placeholder="Ton estimation"><br><button id="val" class="gold" onclick="checkPrice()">VALIDER</button><button id="nx" class="gold" style="display:none" onclick="next(${price.length})">SUIVANT →</button></div><div id="fb" class="fb"></div></div>`}
function checkPrice(){let x=price[S.i],v=parseFloat(document.getElementById("pi").value);if(isNaN(v))return;let d=Math.abs(v-x[1]),p=d<=x[2]?x[4]:d<=x[3]?Math.max(1,x[4]-1):0;add(p);fb(`<b>${p} point${p>1?"s":""}. Réponse : ${x[1]}</b><br>${x[5]}`);swap();document.getElementById("pi").disabled=true}
function eyeRender(){let x=eye[S.i],visual=x[0]?`<img class="photo" src="${x[0]}">`:`<div class="placeholder">🏛️</div>`;app.innerHTML=`<div class="card">${hd(eye.length)}${visual}<div class="q">${x[1]}</div><div class="answers">${x[2].map((a,k)=>`<button class="a" data-k="${k}" onclick="choose(${k})"><b>${"ABCD"[k]}.</b> ${a}</button>`).join("")}</div><div id="fb" class="fb"></div><button id="val" class="gold" onclick="checkEye()">VALIDER</button><button id="nx" class="gold" style="display:none" onclick="next(${eye.length})">SUIVANT →</button></div>`}
function checkEye(){let x=eye[S.i];if(S.sel===null)return;document.querySelectorAll(".a").forEach(b=>{let k=+b.dataset.k;if(k===x[3])b.classList.add("ok");if(k===S.sel&&k!==x[3])b.classList.add("bad");b.disabled=true});if(S.sel===x[3])add(1);fb(x[4]);swap()}
function end(){
S.done[S.g]=true;
let x=G[S.g], all=S.done.every(Boolean);
app.innerHTML=`<div class="card center"><div style="font-size:70px">${x[0]}</div><h1>Défi terminé ✓</h1><h2>${S.s[S.g]} / ${x[2]}</h2><p class="lead">Score cumulé : <b>${S.total}/50</b></p><button class="gold" onclick="${all?"finish()":"menu()"}">${all?"VOIR MON RÉSULTAT":"RETOUR AUX DÉFIS"}</button></div>`}
function finish(){localStorage.setItem("challengeEcoV3",JSON.stringify({nom:S.name,total:S.total,scores:S.s,date:new Date().toISOString()}));app.innerHTML=`<div class="card center"><div style="font-size:80px">🏆</div><h1>${S.name}</h1><div style="font-size:65px;font-weight:900;color:var(--g)">${Number.isInteger(S.total)?S.total:S.total.toFixed(2).replace(/0$/,"")}/50</div><div class="results">${G.map((x,i)=>`<div class="r">${x[0]} ${x[1]}<strong>${S.s[i]}/${x[2]}</strong></div>`).join("")}</div><p class="lead">Résultat conservé sur cet appareil. La transmission vers Google Sheets sera ajoutée après la mise en ligne sur GitHub Pages.</p><button class="blue" onclick="location.reload()">RECOMMENCER</button></div>`}
home();
</script></body></html>
